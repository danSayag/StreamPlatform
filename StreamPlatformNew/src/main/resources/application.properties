# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# H2 console must stay off unless explicitly enabled for local debugging
# (export H2_CONSOLE_ENABLED=true), since it allows arbitrary SQL execution.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
# Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# JWT Configuration
# Must be provided via the JWT_SECRET env var (>= 32 bytes for HS256).
# No insecure default is baked in here; JwtUtil fails fast if it's missing/weak.
jwt.secret=${JWT_SECRET:}
jwt.expiration=3600000
# Seeded admin account (DataInitializer). Override via the ADMIN_PASSWORD env var.
app.admin.password=${ADMIN_PASSWORD:admin}