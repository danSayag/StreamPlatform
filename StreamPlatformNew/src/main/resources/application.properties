# PostgreSQL Database Configuration
# All values are env-overridable so the same jar runs locally and in deployment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stream}
spring.datasource.username=${DB_USERNAME:postgres}
# Local-dev fallback only. Set DB_PASSWORD in any non-local environment.
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# JWT Configuration
# Must be provided via the JWT_SECRET env var (>= 32 bytes for HS256).
# No insecure default is baked in here; JwtUtil fails fast if it's missing/weak.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Media library. Video files live under this folder and a movie's videoPath is stored
# relative to it; VideoStreamService refuses anything that resolves outside it.
app.media.root=${MEDIA_ROOT:D:/MovieLib}

# Seeded admin account (DataInitializer). Override via the ADMIN_PASSWORD env var.
app.admin.password=${ADMIN_PASSWORD:admin}
